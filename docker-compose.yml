version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: docai-rabbitmq
    command: /bin/sh -c "rabbitmq-plugins enable rabbitmq_prometheus rabbitmq_management; rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docai-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  docai-backend:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: ./docai-backend
    container_name: docai-backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-docaidb}
      DB_USER: ${DB_USER}
      NEON_ENDPOINT: ${NEON_ENDPOINT}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      RAG_SERVICE_URL: http://docai-rag-api:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  docai-rag-api:
    build:
      context: ./docai-rag-service
    container_name: docai-rag-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_BACKEND_URL: http://docai-backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/app/chroma_store
    depends_on:
      rabbitmq:
        condition: service_healthy
      docai-backend:
        condition: service_started

  docai-rag-worker:
    build:
      context: ./docai-rag-service
    container_name: docai-rag-worker
    command: python -m app.worker
    healthcheck:
      disable: true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_BACKEND_URL: http://docai-backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    volumes:
      - chroma_data:/app/chroma_store
    depends_on:
      rabbitmq:
        condition: service_healthy
      docai-backend:
        condition: service_started

  docai-frontend:
    build:
      context: ./docai-frontend
    container_name: docai-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - docai-backend

volumes:
  chroma_data:
