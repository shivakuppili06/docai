version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: docai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docai"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: docai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  docai-backend:
    build:
      context: ./docai-backend
    container_name: docai-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docai
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      RAG_SERVICE_URL: http://docai-rag-api:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  docai-rag-api:
    build:
      context: ./docai-rag-service
    container_name: docai-rag-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_BACKEND_URL: http://docai-backend:8080
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      docai-backend:
        condition: service_started

  docai-rag-worker:
    build:
      context: ./docai-rag-service
    container_name: docai-rag-worker
    command: python -m app.worker
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_BACKEND_URL: http://docai-backend:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      docai-backend:
        condition: service_started

  docai-frontend:
    build:
      context: ./docai-frontend
    container_name: docai-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - docai-backend

