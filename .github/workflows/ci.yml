name: DocAI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # ===============================================================
  # Job 1: Frontend (React, Vite, TypeScript, Vitest, Playwright E2E)
  # ===============================================================
  frontend-ci:
    name: Frontend Quality & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docai-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docai-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: docai-frontend/playwright-report/
          retention-days: 14

  # ===============================================================
  # Job 2: Backend (Spring Boot 3, Java 21, Maven)
  # ===============================================================
  backend-ci:
    name: Backend Build & Tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docai-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and run tests
        env:
          JWT_SECRET: ci-test-jwt-secret-key-that-is-at-least-32-bytes-long!
          SERVICE_API_KEY: ci-test-service-api-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
        run: mvn clean test --batch-mode

  # ===============================================================
  # Job 3: RAG Service (Python FastAPI, LangChain, ChromaDB)
  # ===============================================================
  rag-ci:
    name: RAG Service Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docai-rag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docai-rag-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-mock

      - name: Run unit & endpoint tests
        env:
          SERVICE_API_KEY: ci-test-service-api-key
          GEMINI_API_KEY: dummy-key-for-unit-tests
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest -v
