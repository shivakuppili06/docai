server:
  port: 8080

spring:
  application:
    name: docai-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docaidb}?sslmode=require&options=endpoint%3D${NEON_ENDPOINT:ep-green-flower-b3vwgr4h-pooler}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  rag-service:
    base-url: ${RAG_SERVICE_URL:http://localhost:8000}
    api-key: ${SERVICE_API_KEY}

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:default}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:default}
  region: ${AWS_REGION:us-east-1}
  s3-bucket: ${AWS_S3_BUCKET:default}
